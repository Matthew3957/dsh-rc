name: leak-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan PR for private data
        run: scripts/leak-check.sh "${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}"
