name: leak-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan PR for private data
        run: scripts/leak-check.sh "origin/${{ github.base_ref }}"
