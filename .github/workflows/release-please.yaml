name: release-please
on:
  push:
    branches: [main]
# One run at a time: overlapping runs can open duplicate release PRs or race on the manifest.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN: events it makes never start other workflows, so release PRs get no
      # leak-check or commit-check run and the merge gate holds them for a human. A GitHub
      # App token (the GlueOps setup) would run CI on them and trigger builds on tags.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
