<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dsh">
<title>dsh-rc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="prices.js"></script>
<script type="module" src="review.js"></script>
<script type="module" src="session-actions.js"></script>
<script type="module" src="schedules.js"></script>
<script type="module" src="dsh02.js"></script>
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="qr.js" defer></script>
<script src="app.js" defer></script>
<script src="schedules-ui.js" defer></script>
</head>
<body>
<div id="app">

  <!-- Session list -->
  <section id="listView" class="view">
    <header class="bar listbar">
      <button id="menuListBtn" class="icon round-btn" aria-label="Menu" title="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h16"/></svg></button>
      <h1 class="listtitle">Sessions<span class="conn dot" title="connection"></span></h1>
      <button id="filterBtn" class="icon round-btn" aria-label="View" title="View" aria-haspopup="dialog"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </header>
    <div id="listScroll" class="listscroll">
      <div id="pendingGlobal"></div>
      <div id="api403"></div>
      <!-- Running now: what every active session is doing with itself right now.
           A quiet one-line row, folded by default; tapping it opens the cards. -->
      <section id="running" class="running" hidden aria-label="Running now">
        <button id="runningHead" class="running-head" type="button" aria-expanded="false" aria-controls="runningCards">
          <span class="running-dot" aria-hidden="true"></span>
          <span class="running-label">Running now</span>
          <span id="runningCount" class="running-count"></span>
          <span class="running-caret" aria-hidden="true">▾</span>
        </button>
        <div id="runningCards" class="running-cards" hidden></div>
      </section>
      <ul id="sessions" class="sessions"></ul>
      <button id="moreBtn" class="ghost wide" hidden>Show more</button>
    </div>
    <!-- Floating actions. Search opens into the same strip instead of a permanent bar. -->
    <div id="listDock" class="listdock">
      <div class="dockrow" id="dockActions">
        <button id="searchBtn" class="fab" aria-label="Search sessions" title="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
        <button id="newBtn" class="newpill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New session</button>
      </div>
      <div class="dockrow searchrow" id="searchRow" hidden>
        <input id="q" type="search" placeholder="Search sessions" autocomplete="off" enterkeyhint="search" aria-label="Search sessions">
        <button id="searchClose" class="fab" aria-label="Close search" title="Close search">✕</button>
      </div>
    </div>
  </section>

  <!-- Chat -->
  <section id="chatView" class="view" hidden>
    <header class="bar">
      <button id="backBtn" class="icon" aria-label="Back">‹</button>
      <div class="titles">
        <div id="title" class="title">Session</div>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <span class="conn dot" title="connection"></span>
      <button id="menuBtn" class="icon" aria-label="Menu">⋯</button>
    </header>
    <!-- Status line: model and route, context fill, session tokens, estimated cost.
         Hidden until dsh reports something real to show. Tapping expands the
         per-turn breakdown. -->
    <div id="statusBar" class="status-bar" hidden>
      <button id="statusLine" class="status-line" type="button" aria-expanded="false" aria-controls="statusBreakdown">
        <span id="statusSummary" class="status-summary"></span>
        <span id="statusCaret" class="status-caret" aria-hidden="true">▾</span>
      </button>
      <div id="statusBreakdown" class="status-breakdown" hidden></div>
    </div>
    <!-- Goal line: the session's goal and its progress (dsh 0.2). Tapping opens the goal sheet. -->
    <button id="goalBar" class="goal-bar" type="button" hidden aria-label="Session goal"></button>
    <div id="feed">
      <button id="olderBtn" class="ghost wide" hidden>Load earlier</button>
      <div id="msgs"></div>
      <div id="working" hidden><span class="spin">▍</span> <span id="workingText">Working…</span></div>
    </div>
    <button id="jumpBtn" class="jump" hidden aria-label="Scroll to bottom">↓</button>
    <div id="dock">
      <div id="pending"></div>
      <div id="queueLine" hidden></div>
      <div id="cmdpop" hidden></div>
      <div id="attachments" hidden></div>
      <form id="composer" autocomplete="off">
        <button type="button" id="attachBtn" class="icon round" aria-label="Attach image">+</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <button type="button" id="tmplBtn" class="icon round" aria-label="Prompt templates" title="Saved prompt templates">Aa</button>
        <textarea id="input" rows="1" placeholder="Message dsh" enterkeyhint="send"></textarea>
        <!-- Dictation: revealed by app.js only where the Web Speech API exists. -->
        <button type="button" id="micBtn" class="icon round" aria-label="Dictate" title="Dictate" aria-pressed="false" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button>
        <button type="button" id="steerBtn" class="chip" hidden title="Send into the running turn instead of queueing">queue</button>
        <button type="submit" id="sendBtn" class="icon round accent" aria-label="Send">↑</button>
        <button type="button" id="stopBtn" class="icon round stop" aria-label="Stop" hidden>■</button>
      </form>
    </div>
  </section>

  <!-- Bottom sheet -->
  <div id="scrim" hidden></div>
  <div id="sheet" hidden><div class="sheethead"><div class="grab"></div><button id="sheetClose" class="icon" aria-label="Close">✕</button></div><div id="sheetBody"></div></div>
  <div id="toast" hidden></div>
</div>
</body>
</html>
