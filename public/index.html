<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS home-screen status bar: "default", an opaque bar the page starts below, chosen for every
     theme and both schemes. The two theme-color metas above always equal the page background
     (theme.js sets them to the active theme's --bg, light and dark; test/theme-contrast.test.mjs
     keeps theme.js equal to style.css), so where iOS paints the bar from theme-color it reads as
     part of the page, and where it does not the bar is the system's plain light or dark one,
     which still follows the scheme. "black-translucent" would draw the page under the bar: fine
     on a dark page, but white status text over a light one, and in iOS 26 home-screen apps it
     leaves the page one bar short of the bottom (WebKit bug 301108). Keep "default". -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dsh">
<title>dsh-rc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script type="module" src="prices.js"></script>
<script type="module" src="review.js"></script>
<script type="module" src="session-actions.js"></script>
<script type="module" src="schedules.js"></script>
<script type="module" src="links.js"></script>
<script type="module" src="dsh02.js"></script>
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="qr.js" defer></script>
<script src="app.js" defer></script>
<script src="schedules-ui.js" defer></script>
</head>
<body>
<div id="app">

  <!-- Session list: one board in attention order. Needs you, Running now, Unread, then Today and
       Earlier. Each session appears once; the sections are the filter. -->
  <section id="listView" class="view">
    <header class="nav" id="listNav">
      <!-- The leading slot stays empty so the compact title stays centred. -->
      <div class="nav-lead"></div>
      <!-- The compact title fades in once the large title has scrolled under the bar. -->
      <div class="nav-title listtitle" id="listTitle" aria-hidden="true">Sessions</div>
      <!-- Two bar actions, both trailing: search, then Settings (the app-wide sheet). -->
      <div class="nav-trail">
        <button id="searchBtn" class="navbtn" type="button" aria-label="Search sessions" title="Search" aria-controls="searchRow" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
        <button id="settingsBtn" class="navbtn" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.84 4.92 10.17 2.58A9.6 9.6 0 0 1 13.83 2.58L14.16 4.92A7.4 7.4 0 0 1 15.47 5.47L17.37 4.04A9.6 9.6 0 0 1 19.96 6.63L18.53 8.53A7.4 7.4 0 0 1 19.08 9.84L21.42 10.17A9.6 9.6 0 0 1 21.42 13.83L19.08 14.16A7.4 7.4 0 0 1 18.53 15.47L19.96 17.37A9.6 9.6 0 0 1 17.37 19.96L15.47 18.53A7.4 7.4 0 0 1 14.16 19.08L13.83 21.42A9.6 9.6 0 0 1 10.17 21.42L9.84 19.08A7.4 7.4 0 0 1 8.53 18.53L6.63 19.96A9.6 9.6 0 0 1 4.04 17.37L5.47 15.47A7.4 7.4 0 0 1 4.92 14.16L2.58 13.83A9.6 9.6 0 0 1 2.58 10.17L4.92 9.84A7.4 7.4 0 0 1 5.47 8.53L4.04 6.63A9.6 9.6 0 0 1 6.63 4.04L8.53 5.47A7.4 7.4 0 0 1 9.84 4.92Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <!-- Search opens in the bar: a full-width field and Cancel. -->
      <div class="searchrow" id="searchRow" role="search" hidden>
        <input id="q" class="field" type="search" placeholder="Search sessions" autocomplete="off" enterkeyhint="search" aria-label="Search sessions">
        <button id="searchClose" class="btn btn-plain textbtn" type="button">Cancel</button>
      </div>
    </header>
    <!-- Banner slot: conditions that last (offline) sit here, under the bar, not in a toast. -->
    <div class="banner-slot">
      <div class="banner offline conn-banner" role="status" hidden><span class="glyph run" aria-hidden="true"></span><span>Reconnecting…</span></div>
    </div>
    <div id="listScroll" class="listscroll">
      <h1 class="largetitle" id="listLargeTitle">Sessions</h1>
      <div id="api403"></div>
      <!-- Needs you: one row per session waiting on an approval or a question. -->
      <section id="pendingGlobal" class="board-sec needs" aria-labelledby="needsHead" hidden></section>
      <!-- Running now: a live row per active session (a turn, a live job or a live subagent). -->
      <section id="running" class="board-sec running" hidden aria-labelledby="runningHead">
        <h2 id="runningHead" class="sec-head"><span class="sec-label">Running now</span> <span id="runningCount" class="sec-count"></span></h2>
        <ul id="runningCards" class="run-rows"></ul>
      </section>
      <!-- Unread, Today and Earlier: everything not already above. -->
      <div id="sessions" class="sessions"></div>
      <button id="moreBtn" class="morebtn" type="button" hidden>Show earlier sessions</button>
      <!-- Search results replace the board while the search field is open. -->
      <ul id="searchResults" class="sess-list" aria-label="Search results" hidden></ul>
    </div>
    <!-- Bottom bar: the one primary action. -->
    <footer id="listDock" class="bottombar">
      <div class="dockrow" id="dockActions">
        <button id="newBtn" class="btn btn-primary" type="button" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New session</button>
      </div>
    </footer>
  </section>

  <!-- Chat -->
  <section id="chatView" class="view" hidden>
    <header class="nav" id="chatNav">
      <div class="nav-lead">
        <button id="backBtn" class="navbtn" type="button" aria-label="Back" title="Sessions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      </div>
      <div class="titles nav-titles" id="sessionTitleButton" role="button" tabindex="0" aria-haspopup="dialog" title="Session details">
        <div id="title" class="title nav-title">Session</div>
        <div id="subtitle" class="subtitle nav-sub"></div>
      </div>
      <div class="nav-trail">
        <button id="menuBtn" class="navbtn" type="button" aria-label="Session menu" title="Menu" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="18.5" cy="12" r="1.25"/></svg></button>
      </div>
    </header>
    <div class="banner-slot">
      <div class="banner offline conn-banner" role="status" hidden><span class="glyph run" aria-hidden="true"></span><span>Reconnecting…</span></div>
    </div>
    <!-- Goal line: the session's goal and its progress (dsh 0.2). Tapping opens the goal sheet. -->
    <button id="goalBar" class="goal-bar" type="button" hidden aria-label="Session goal"></button>
    <div id="feed">
      <button id="olderBtn" class="ghost wide" hidden>Load earlier</button>
      <div id="msgs"></div>
      <div id="working" hidden><span class="glyph run" aria-hidden="true"></span> <span>Working</span><span id="workingText" class="working-elapsed"></span></div>
    </div>
    <button id="jumpBtn" class="jump" hidden aria-label="New activity">↓ <span>New activity</span></button>
    <!-- Dock: the decision cards (capped, with their own scroll), the queued-message banner,
         the slash and mention list, attachments, the Queue/Steer choice while a turn runs,
         and the one-field composer. -->
    <div id="dock">
      <div id="pending" role="region" aria-label="Waiting for you"></div>
      <div id="queueLine" hidden></div>
      <div id="cmdpop" hidden></div>
      <div id="attachments" aria-label="Attachments" hidden></div>
      <!-- Only while a turn runs and there is something to send. app.js fills the segmented. -->
      <div id="modeRow" class="seg-row mode-row" hidden></div>
      <form id="composer" autocomplete="off">
        <!-- Plus: Photo library, File, Prompt template and Commands, in a small sheet. -->
        <button type="button" id="attachBtn" class="cbtn plus" aria-label="Add a photo, file, template or command" title="Add" aria-haspopup="dialog"><span class="cbtn-ink" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 6.5v11M6.5 12h11"/></svg></span></button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message dsh" enterkeyhint="send" aria-label="Message dsh"></textarea>
        <!-- Dictation: revealed by app.js only where the Web Speech API exists. -->
        <button type="button" id="micBtn" class="cbtn mic" aria-label="Dictate" title="Dictate" aria-pressed="false" hidden><span class="cbtn-ink" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></span></button>
        <!-- One control, one position: Send, or Stop while a turn runs and the field is empty. -->
        <button type="button" id="sendBtn" class="cbtn send" data-state="send" aria-label="Send" disabled><span class="cbtn-ink" aria-hidden="true"><svg class="i-send" viewBox="0 0 24 24"><path d="M12 18V6.5M7 11.5l5-5 5 5"/></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></svg></span></button>
      </form>
    </div>
  </section>

  <!-- Sheet: one shell for every sheet. A grabber, a title row (back while a sub-sheet is open,
       Done or Cancel), a scrolling body, and a sticky footer for the primary action.
       app.js fills the title from the sheet's leading heading and keeps the back stack. -->
  <div id="scrim" hidden></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" data-size="medium" hidden>
    <div class="sheethead">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-titlerow">
        <div class="nav-lead">
          <button id="sheetBack" class="navbtn" type="button" aria-label="Back" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
        </div>
        <div id="sheetTitle" class="sheet-title"></div>
        <div class="nav-trail">
          <button id="sheetClose" class="btn btn-plain textbtn" type="button">Done</button>
        </div>
      </div>
    </div>
    <div id="sheetBody"></div>
    <div id="sheetFoot" class="sheetfoot" hidden></div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <!-- Screen reader announcements: a turn that just ended, a decision that just arrived. -->
  <div id="announce" class="vh" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
</body>
</html>
