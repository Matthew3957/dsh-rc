<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dsh">
<title>dsh-rc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script type="module" src="prices.js"></script>
<script type="module" src="review.js"></script>
<script type="module" src="session-actions.js"></script>
<script type="module" src="schedules.js"></script>
<script type="module" src="links.js"></script>
<script type="module" src="dsh02.js"></script>
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="qr.js" defer></script>
<script src="app.js" defer></script>
<script src="schedules-ui.js" defer></script>
</head>
<body>
<div id="app">

  <!-- Session list -->
  <section id="listView" class="view">
    <header class="nav" id="listNav">
      <div class="nav-lead">
        <button id="menuListBtn" class="navbtn" type="button" aria-label="Menu" title="Menu" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <h1 class="nav-title listtitle" id="listTitle">Sessions</h1>
      <div class="nav-trail">
        <button id="filterBtn" class="navbtn" type="button" aria-label="View" title="View" aria-haspopup="dialog" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      </div>
    </header>
    <!-- Banner slot: conditions that last (offline) sit here, under the bar, not in a toast. -->
    <div class="banner-slot">
      <div class="banner offline conn-banner" role="status" hidden><span class="glyph run" aria-hidden="true"></span><span>Reconnecting…</span></div>
    </div>
    <div id="listScroll" class="listscroll">
      <div id="pendingGlobal"></div>
      <div id="api403"></div>
      <!-- Running now: what every active session is doing with itself right now.
           A quiet one-line row, folded by default; tapping it opens the cards. -->
      <section id="running" class="running" hidden aria-label="Running now">
        <button id="runningHead" class="running-head" type="button" aria-expanded="false" aria-controls="runningCards">
          <span class="running-label">Running now</span>
          <span id="runningCount" class="running-count"></span>
          <svg class="ico running-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="runningCards" class="running-cards" hidden></div>
      </section>
      <ul id="sessions" class="sessions"></ul>
      <button id="moreBtn" class="btn btn-plain wide" type="button" hidden>Show more</button>
    </div>
    <!-- Bottom bar: search and the one primary action. Search opens into the same bar. -->
    <footer id="listDock" class="bottombar">
      <div class="dockrow" id="dockActions">
        <button id="searchBtn" class="navbtn" type="button" aria-label="Search sessions" title="Search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
        <button id="newBtn" class="btn btn-primary" type="button" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New session</button>
      </div>
      <div class="dockrow searchrow" id="searchRow" hidden>
        <input id="q" class="field" type="search" placeholder="Search sessions" autocomplete="off" enterkeyhint="search" aria-label="Search sessions">
        <button id="searchClose" class="btn btn-plain" type="button">Cancel</button>
      </div>
    </footer>
  </section>

  <!-- Chat -->
  <section id="chatView" class="view" hidden>
    <header class="nav" id="chatNav">
      <div class="nav-lead">
        <button id="backBtn" class="navbtn" type="button" aria-label="Back" title="Sessions"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      </div>
      <div class="titles nav-titles">
        <div id="title" class="title nav-title">Session</div>
        <div id="subtitle" class="subtitle nav-sub"></div>
      </div>
      <div class="nav-trail">
        <button id="menuBtn" class="navbtn" type="button" aria-label="Session menu" title="Menu" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="18.5" cy="12" r="1.25"/></svg></button>
      </div>
    </header>
    <div class="banner-slot">
      <div class="banner offline conn-banner" role="status" hidden><span class="glyph run" aria-hidden="true"></span><span>Reconnecting…</span></div>
    </div>
    <!-- Status line: model and route, context fill, session tokens, estimated cost.
         Hidden until dsh reports something real to show. Tapping expands the
         per-turn breakdown. -->
    <div id="statusBar" class="status-bar" hidden>
      <button id="statusLine" class="status-line" type="button" aria-expanded="false" aria-controls="statusBreakdown">
        <span id="statusSummary" class="status-summary"></span>
        <span id="statusCaret" class="status-caret" aria-hidden="true">▾</span>
      </button>
      <div id="statusBreakdown" class="status-breakdown" hidden></div>
    </div>
    <!-- Goal line: the session's goal and its progress (dsh 0.2). Tapping opens the goal sheet. -->
    <button id="goalBar" class="goal-bar" type="button" hidden aria-label="Session goal"></button>
    <div id="feed">
      <button id="olderBtn" class="ghost wide" hidden>Load earlier</button>
      <div id="msgs"></div>
      <div id="working" hidden><span class="spin">▍</span> <span id="workingText">Working…</span></div>
    </div>
    <button id="jumpBtn" class="jump" hidden aria-label="Scroll to bottom">↓</button>
    <div id="dock">
      <div id="pending"></div>
      <div id="queueLine" hidden></div>
      <div id="cmdpop" hidden></div>
      <div id="attachments" hidden></div>
      <form id="composer" autocomplete="off">
        <button type="button" id="attachBtn" class="icon round" aria-label="Attach image">+</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <button type="button" id="tmplBtn" class="icon round" aria-label="Prompt templates" title="Saved prompt templates">Aa</button>
        <textarea id="input" rows="1" placeholder="Message dsh" enterkeyhint="send"></textarea>
        <!-- Dictation: revealed by app.js only where the Web Speech API exists. -->
        <button type="button" id="micBtn" class="icon round" aria-label="Dictate" title="Dictate" aria-pressed="false" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button>
        <button type="button" id="steerBtn" class="chip" hidden title="Send into the running turn instead of queueing">queue</button>
        <button type="submit" id="sendBtn" class="icon round accent" aria-label="Send">↑</button>
        <button type="button" id="stopBtn" class="icon round stop" aria-label="Stop" hidden>■</button>
      </form>
    </div>
  </section>

  <!-- Sheet: one shell for every sheet. A grabber, a title row (back while a sub-sheet is open,
       Done or Cancel), a scrolling body, and a sticky footer for the primary action.
       app.js fills the title from the sheet's leading heading and keeps the back stack. -->
  <div id="scrim" hidden></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" data-size="medium" hidden>
    <div class="sheethead">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-titlerow">
        <div class="nav-lead">
          <button id="sheetBack" class="navbtn" type="button" aria-label="Back" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
        </div>
        <div id="sheetTitle" class="sheet-title"></div>
        <div class="nav-trail">
          <button id="sheetClose" class="btn btn-plain textbtn" type="button">Done</button>
        </div>
      </div>
    </div>
    <div id="sheetBody"></div>
    <div id="sheetFoot" class="sheetfoot" hidden></div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>
</body>
</html>
